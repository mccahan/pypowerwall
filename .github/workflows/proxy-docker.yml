name: proxy-docker

# Manual dispatch only - can be triggered from GitHub Actions tab
on:
  workflow_dispatch:
  push:
    branches:
      - my-main

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy local pypowerwall
        run: |
          cp -r pypowerwall/ proxy/
          echo 'RUN pip show pypowerwall'
          echo 'COPY ./pypowerwall /usr/local/lib/python3.10/site-packages/' >> proxy/Dockerfile

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: proxy/
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pypowerwall:latest
            ghcr.io/${{ github.repository_owner }}/pypowerwall:${{ github.sha }}
